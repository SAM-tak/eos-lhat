name: Native releases

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: ${{ matrix.platform }} / Release and tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            library: eos_lhat.dll
          - platform: linux-x64
            runner: ubuntu-22.04
            library: eos_lhat.so
          - platform: macos-arm64
            runner: macos-15
            library: eos_lhat.dylib
          - platform: macos-x64
            runner: macos-15-intel
            library: eos_lhat.dylib
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout bindings
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read dependency revisions
        id: revisions
        run: |
          foreach ($dependency in @('lhat', 'eos-sdk')) {
            $revision = (Get-Content -Raw "$dependency.rev").Trim()
            if ($revision -cnotmatch '^[0-9a-f]{40}$') {
              throw "Invalid revision in $dependency.rev"
            }
            "$dependency=$revision" >> $env:GITHUB_OUTPUT
          }

      - name: Check SDK access configuration
        env:
          SDK_TOKEN: ${{ secrets.EOS_SDK_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SDK_TOKEN)) {
            throw 'Set EOS_SDK_READ_TOKEN in the eos-lhat repository Actions secrets.'
          }

      - name: Checkout L^
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAM-tak/lhat
          ref: ${{ steps.revisions.outputs.lhat }}
          path: build-deps/lhat
          persist-credentials: false

      - name: Checkout private EOS SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAM-tak/eos-sdk-private
          ref: ${{ steps.revisions.outputs.eos-sdk }}
          token: ${{ secrets.EOS_SDK_READ_TOKEN }}
          path: EOSSDK
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Build and test Windows
        if: runner.os == 'Windows'
        env:
          CMAKE_GENERATOR: Visual Studio 17 2022
          CMAKE_GENERATOR_PLATFORM: x64
        run: |
          ./scripts/build.ps1 -Lhat "$PWD/build-deps/lhat" -Sdk "$PWD/EOSSDK/SDK" -Test

      - name: Build and test Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DLHAT_ROOT="$PWD/build-deps/lhat" -DEOS_SDK_ROOT="$PWD/EOSSDK/SDK"
          cmake --build build --config Release --parallel 2
          python scripts/embed-signatures.py
          ctest --test-dir build -C Release --output-on-failure
          python tests/test_lhat.py --lhat "$PWD/build-deps/lhat"

      - name: Stage the release library
        run: |
          cmake --install build --config Release --prefix build/package
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          $files = @(Get-ChildItem -LiteralPath build/package -Recurse -File)
          if ($files.Count -ne 1 -or $files[0].Name -cne '${{ matrix.library }}') {
            throw 'The release package must contain only ${{ matrix.library }}'
          }

      - name: Test installed library and relative SDK lookup
        run: |
          python tests/test_lhat.py --lhat "$PWD/build-deps/lhat" --installed "$PWD/build/package/native/${{ matrix.library }}"

      - name: Upload tested library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eos-lhat-${{ matrix.platform }}
          path: build/package/native/${{ matrix.library }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: eos-lhat-*
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cp release/eos-lhat-windows-x64/eos_lhat.dll release/eos_lhat.dll
          cp release/eos-lhat-linux-x64/eos_lhat.so release/eos_lhat.so
          cp release/eos-lhat-macos-arm64/eos_lhat.dylib release/eos_lhat-macos-arm64.dylib
          cp release/eos-lhat-macos-x64/eos_lhat.dylib release/eos_lhat-macos-x64.dylib
          assets=(release/*.dll release/*.so release/*.dylib)
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes
          fi
